# Trivy secret scanning (used by the image job in .github/workflows/ci.yml).
# yt-dlp ships public API credentials inside some extractors (e.g. shahid.py's
# AWS key for that service's public API). They are part of the library, not
# secrets of this project, so only that directory is allowed; a secret anywhere
# else in the image still fails the build.
allow-rules:
  - id: yt-dlp-extractor-public-keys
    description: Public API credentials bundled in yt-dlp extractors
    path: .*/site-packages/yt_dlp/extractor/.*\.py
