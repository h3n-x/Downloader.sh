name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check --output-format=github .
      - run: uv run mypy src tests
      - run: uv run pytest -q
      - name: OpenAPI contract is up to date
        run: |
          uv run python -m downloader.api.openapi > /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json
      - run: uv run pip-audit --progress-spinner off --skip-editable

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - name: Generated API types are up to date
        run: pnpm gen:api && git diff --exit-code src/lib/api-types.ts
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile && pnpm build && pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-traces, path: frontend/test-results, retention-days: 7 }

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: downloader:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (non-root, read-only rootfs)
        run: |
          docker run -d --name app --read-only --tmpfs /data:size=4g,uid=10001,gid=10001 \
            --cap-drop ALL --security-opt no-new-privileges -e DL_MAX_FILESIZE=1000000000 \
            -p 8000:8000 downloader:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/v1/ready && break; sleep 1; done
          curl -fsS localhost:8000/ | grep -q "downloader.sh"
          test "$(docker exec app id -u)" = "10001"
      - name: Vulnerability and secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SECRET_CONFIG: trivy-secret.yaml
        with:
          image-ref: downloader:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: downloader:ci, format: cyclonedx, output: sbom.cdx.json, scan-type: image }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom, path: sbom.cdx.json }
